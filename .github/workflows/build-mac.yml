name: build-mac

# 在 GitHub 的 macOS 机器上打出 dmg / zip，不需要本机有 Mac
# 触发方式：仓库页面 Actions → build-mac → Run workflow，或打一个 v* 标签

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  mac:
    runs-on: macos-14          # Apple Silicon，能同时出 arm64 和 x64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 打包 dmg + zip
        # --publish never：Actions 里存在 GITHUB_REPOSITORY，electron-builder 会误以为
        # 要发布 Release 并索要 GH_TOKEN，这里明确只要产物、不发布
        run: npx electron-builder --mac --publish never
        env:
          # 没有 Apple 开发者证书，跳过自动查找，由 afterPack 钩子做 ad-hoc 签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # CI 上直连 GitHub 下载 Electron 比走镜像快，这里不设 ELECTRON_MIRROR

      - name: 列出产物
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: shiyue-mac
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.dmg
            dist/*.zip
