name: build-android

# 在 GitHub 的 Ubuntu 机器上打 APK（本机不需要装 Android SDK）
# 触发：Actions → build-android → Run workflow，或打 v* 标签

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # Capacitor 6 / AGP 8 要求 17

      # 不用 android-actions/setup-android：它会去装早已废弃的 "tools" 包然后失败。
      # ubuntu-latest 镜像自带 SDK，直接用。
      - name: 确认 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成浏览器版正文提取器
        # lib/extract.js 是零依赖的纯字符串处理，套一层 IIFE 就能给页面用
        run: node tools/make-mobile-extract.js

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 换图标
        # 模板自带的是 Capacitor 的默认图标，用 android-res/ 里按密度生成好的替换。
        # 顺手删掉 anydpi-v26 的自适应图标描述，让它直接吃 PNG，省得前景层再调一次版。
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-res/mipmap-* android/app/src/main/res/

      - name: 同步网页资源到原生工程
        run: npx cap sync android

      - name: 打包 APK
        # debug 包自带调试签名，能直接装在平板上（系统会提示「未知来源」）
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 改名
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/拾阅-$(node -p "require('./package.json').version")-android.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: shiyue-apk
          if-no-files-found: error
          retention-days: 30
          path: out/*.apk
